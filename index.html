  {"id":"t30","title":"The Guitar in the Attic","type":"story","level":"B2","en":"When Pau cleared out his late uncle's attic, he found an old electric guitar wrapped in a blanket. The strings were rusty and one of the knobs was missing, but the neck was still straight. He took it to a small repair shop, expecting to hear that it was worthless. Instead, the repairer smiled and said it had been made by hand in the seventies. A week later, Pau picked it up with new strings and a fresh setup. That evening he played a simple blues in his living room, and the guitar sounded warmer than anything he had ever owned. He felt that his uncle, who had never talked much about music, was finally telling him something.","es":"Cuando Pau vació el desván de su difunto tío, encontró una vieja guitarra eléctrica envuelta en una manta. Las cuerdas estaban oxidadas y faltaba uno de los potenciómetros, pero el mástil seguía recto. La llevó a un pequeño taller de reparación, esperando oír que no valía nada. En cambio, el reparador sonrió y le dijo que había sido fabricada a mano en los años setenta. Una semana después, Pau la recogió con cuerdas nuevas y un ajuste recién hecho. Esa noche tocó un blues sencillo en el salón, y la guitarra sonó más cálida que cualquier otra que hubiera tenido. Sintió que su tío, que nunca había hablado mucho de música, por fin le estaba diciendo algo.","keys":"cleared out: vació\nlate uncle: difunto tío\nwrapped in: envuelta en\nrusty: oxidadas\nworthless: sin valor\nsetup: ajuste\npicked it up: la recogió"},
  {"id":"t31","title":"Why Good Musicians Practise Slowly","type":"article","level":"B2+/C1","en":"Many guitarists believe that the quickest way to play fast is to practise fast. In reality, the opposite is usually true. When we rush through a difficult passage, we repeat our mistakes as often as our successes, and the brain learns both. Slow practice gives us time to notice tension in the hand, unnecessary finger movement and uneven timing. Once a phrase feels effortless at a low tempo, the metronome can be raised a little at a time. Teachers often compare this to building a wall: if the first rows are crooked, adding more bricks only makes the problem worse. Speed, in other words, is not something you chase; it is something that appears once control is in place.","es":"Muchos guitarristas creen que la forma más rápida de tocar rápido es practicar rápido. En realidad, suele ocurrir lo contrario. Cuando pasamos con prisas por un pasaje difícil, repetimos nuestros errores tantas veces como nuestros aciertos, y el cerebro aprende ambos. La práctica lenta nos da tiempo para notar la tensión en la mano, los movimientos innecesarios de los dedos y un tempo irregular. Cuando una frase resulta fácil a un tempo bajo, se puede subir el metrónomo poco a poco. Los profesores suelen compararlo con construir un muro: si las primeras hileras están torcidas, añadir más ladrillos solo empeora el problema. En otras palabras, la velocidad no es algo que se persigue; es algo que aparece cuando el control ya está asentado.","keys":"rush through: pasar con prisas\npassage: pasaje\nuneven timing: tempo irregular\neffortless: sin esfuerzo\na little at a time: poco a poco\ncrooked: torcidas\nchase: perseguir\nin place: asentado"},
  {"id":"t32","title":"The Hidden Life Beneath a Vegetable Garden","type":"article","level":"C1","en":"A single handful of healthy soil may contain more living organisms than there are people on Earth. Fungi stretch their threads between plant roots, trading minerals for sugars; bacteria break down organic matter and release nutrients in forms that plants can absorb; earthworms aerate the ground and leave behind fertile casts. Conventional digging, however well-intentioned, can disrupt this network, exposing fragile organisms to sunlight and drying air. This is why many ecological gardeners favour mulching and minimal tillage, feeding the soil rather than the plant. The results are rarely immediate, and the first season may even seem disappointing. Yet over time, a garden managed this way tends to need less water, suffer fewer pests and produce crops that are noticeably more resilient.","es":"Un solo puñado de suelo sano puede contener más organismos vivos que personas hay en la Tierra. Los hongos extienden sus filamentos entre las raíces de las plantas e intercambian minerales por azúcares; las bacterias descomponen la materia orgánica y liberan nutrientes en formas que las plantas pueden absorber; las lombrices airean la tierra y dejan tras de sí deyecciones fértiles. Cavar de la forma convencional, por bienintencionado que sea, puede alterar esta red y exponer organismos frágiles a la luz del sol y al aire seco. Por eso muchos horticultores ecológicos prefieren el acolchado y el laboreo mínimo, alimentando el suelo en lugar de la planta. Los resultados rara vez son inmediatos, y la primera temporada puede incluso parecer decepcionante. Sin embargo, con el tiempo, un huerto gestionado así suele necesitar menos agua, sufrir menos plagas y producir cosechas notablemente más resistentes.","keys":"handful: puñado\nthreads: filamentos\nbreak down: descomponer\naerate: airear\ncasts: deyecciones\nwell-intentioned: bienintencionado\ndisrupt: alterar\nmulching: acolchado\ntillage: laboreo\nresilient: resistentes"},
  {"id":"t33","title":"Waiting for the Wind","type":"story","level":"B2","en":"Every morning that week, Jordi checked the forecast before breakfast. The app promised strong wind in the afternoon, so he packed his kite, his harness and a sandwich, and drove to the beach. Each day the sea stayed flat. Other riders gave up and went home, but Jordi stayed, reading a book in the shade of his van. On Friday, just as the sun was starting to go down, the flags on the beach began to move. Within twenty minutes the wind was perfect. He was on the water in no time, and for an hour he had the whole bay almost to himself. Driving home in the dark, he decided that patience was probably the most underrated skill in the sport.","es":"Cada mañana de aquella semana, Jordi consultaba la previsión antes de desayunar. La aplicación prometía viento fuerte por la tarde, así que preparaba la cometa, el arnés y un bocadillo, y conducía hasta la playa. Cada día el mar seguía en calma. Otros riders se rendían y se iban a casa, pero Jordi se quedaba leyendo un libro a la sombra de su furgoneta. El viernes, justo cuando el sol empezaba a ponerse, las banderas de la playa empezaron a moverse. En veinte minutos el viento era perfecto. Se metió en el agua en un abrir y cerrar de ojos y, durante una hora, tuvo la bahía prácticamente para él solo. Volviendo a casa de noche, decidió que la paciencia era probablemente la habilidad más infravalorada de este deporte.","keys":"forecast: previsión\nharness: arnés\ngave up: se rindieron\nin the shade: a la sombra\nin no time: en un abrir y cerrar de ojos\nto himself: para él solo\nunderrated: infravalorada"},
  {"id":"t34","title":"Why Steel Structures Need Room to Move","type":"article","level":"C1","en":"To the casual observer, a steel bridge or warehouse frame appears perfectly rigid. In fact, steel expands when it warms up and contracts when it cools, and over a long span these small changes add up. A sixty-metre beam exposed to the summer sun can lengthen by several centimetres compared with a winter night. If the structure is restrained at both ends, that movement turns into internal stress, which may buckle members, crack welds or damage the supports. Engineers therefore introduce expansion joints, slotted connections and sliding bearings that allow controlled movement while still transferring loads safely. The paradox is worth remembering: a structure often becomes more reliable precisely because it has been designed not to resist every force head-on.","es":"Para un observador cualquiera, un puente de acero o la estructura de una nave parecen perfectamente rígidos. En realidad, el acero se dilata cuando se calienta y se contrae cuando se enfría, y en una luz larga esos pequeños cambios se van sumando. Una viga de sesenta metros expuesta al sol de verano puede alargarse varios centímetros respecto a una noche de invierno. Si la estructura está coaccionada en ambos extremos, ese movimiento se convierte en tensión interna, que puede pandear elementos, agrietar soldaduras o dañar los apoyos. Por eso los ingenieros introducen juntas de dilatación, uniones con agujeros rasgados y apoyos deslizantes que permiten un movimiento controlado sin dejar de transmitir las cargas con seguridad. Merece la pena recordar la paradoja: a menudo una estructura es más fiable precisamente porque se ha diseñado para no oponerse de frente a todas las fuerzas.","keys":"casual observer: observador cualquiera\nexpands: se dilata\nspan: luz (vano)\nrestrained: coaccionada\nbuckle: pandear\nwelds: soldaduras\nexpansion joints: juntas de dilatación\nslotted connections: uniones con agujeros rasgados\nsliding bearings: apoyos deslizantes\nhead-on: de frente"},
  {"id":"t35","title":"What Happens to Memories While We Sleep","type":"article","level":"B2+/C1","en":"Sleep is often treated as wasted time, something to cut back on when life gets busy. Research suggests that this is a costly mistake. During deep sleep, the brain appears to replay experiences from the day, strengthening the connections that matter and letting others fade. Students who sleep well after learning new vocabulary, for instance, tend to remember more of it the following week than those who stay up late revising. Even a short afternoon nap can make a measurable difference. None of this means that sleep can replace practice; rather, it completes it. If you want new words or new guitar phrases to stick, the hours you spend asleep may be doing more work than you think.","es":"El sueño suele considerarse tiempo perdido, algo que recortar cuando la vida se complica. Las investigaciones sugieren que es un error costoso. Durante el sueño profundo, el cerebro parece reproducir las experiencias del día, reforzando las conexiones importantes y dejando que otras se desvanezcan. Los estudiantes que duermen bien después de aprender vocabulario nuevo, por ejemplo, suelen recordar más la semana siguiente que quienes se quedan despiertos hasta tarde repasando. Incluso una siesta corta por la tarde puede marcar una diferencia medible. Nada de esto significa que el sueño pueda sustituir a la práctica; más bien, la completa. Si quieres que las palabras nuevas o las frases nuevas de guitarra se queden, las horas que pasas durmiendo pueden estar trabajando más de lo que crees.","keys":"cut back on: recortar\ncostly: costoso\nreplay: reproducir\nfade: desvanecerse\nstay up late: quedarse despierto hasta tarde\nnap: siesta\nmeasurable: medible\nstick: quedarse (en la memoria)"},
  {"id":"t36","title":"When Should a Machine Say “I Don't Know”?","type":"article","level":"C1","en":"Language models are remarkably fluent, and fluency is persuasive. A confident, well-structured answer feels trustworthy even when it rests on shaky ground. For this reason, researchers increasingly argue that the most valuable skill an AI assistant can develop is not knowing more, but recognising the limits of what it knows. Calibration, as it is called, means that a system's expressed confidence should match how often it is actually right. Achieving this is harder than it sounds: models are typically rewarded for producing an answer, and hedging can look like weakness. Yet an assistant that occasionally admits uncertainty may ultimately be more useful than one that is always certain, because it gives people a reason to check the claims that matter most.","es":"Los modelos de lenguaje son extraordinariamente fluidos, y la fluidez resulta persuasiva. Una respuesta segura y bien estructurada parece fiable incluso cuando se apoya en terreno poco firme. Por eso los investigadores sostienen cada vez más que la habilidad más valiosa que puede desarrollar un asistente de IA no es saber más, sino reconocer los límites de lo que sabe. La calibración, como se denomina, significa que la confianza que expresa un sistema debería corresponder a la frecuencia con la que realmente acierta. Conseguirlo es más difícil de lo que parece: a los modelos se les suele recompensar por dar una respuesta, y matizar puede parecer debilidad. Sin embargo, un asistente que de vez en cuando admite su incertidumbre puede acabar siendo más útil que uno que siempre está seguro, porque da a las personas un motivo para comprobar las afirmaciones que más importan.","keys":"fluent: fluido\npersuasive: persuasiva\ntrustworthy: fiable\nrests on shaky ground: se apoya en terreno poco firme\ncalibration: calibración\nrewarded: recompensados\nhedging: matizar / no comprometerse\nclaims: afirmaciones"},
  {"id":"t37","title":"The Neighbour's Tomatoes","type":"story","level":"B2+/C1","en":"For three summers in a row, Laia's tomatoes were smaller and sadder than her neighbour's, and she could not work out why. She used the same seeds, watered just as often and even copied his timetable. Eventually, swallowing her pride, she leaned over the fence and asked him directly. The old man laughed and led her to the back of his garden, where a heap of rotting leaves, coffee grounds and horse manure was quietly steaming. \"I don't grow tomatoes,\" he said. \"I grow soil. The tomatoes take care of themselves.\" The following spring Laia started her own compost heap. It took another year before she noticed the difference, but when she finally did, she brought him the first ripe tomato as a thank-you.","es":"Durante tres veranos seguidos, los tomates de Laia fueron más pequeños y tristes que los de su vecino, y no conseguía entender por qué. Usaba las mismas semillas, regaba con la misma frecuencia e incluso copiaba su horario. Finalmente, tragándose el orgullo, se asomó por encima de la valla y se lo preguntó directamente. El anciano se rio y la llevó al fondo de su huerto, donde un montón de hojas podridas, posos de café y estiércol de caballo humeaba en silencio. \"Yo no cultivo tomates\", dijo. \"Cultivo tierra. Los tomates se ocupan de sí mismos.\" La primavera siguiente, Laia empezó su propio montón de compost. Tardó otro año en notar la diferencia, pero cuando por fin lo hizo, le llevó el primer tomate maduro como agradecimiento.","keys":"in a row: seguidos\nwork out: entender / averiguar\nswallowing her pride: tragándose el orgullo\nleaned over: se asomó por encima\nheap: montón\ncoffee grounds: posos de café\nmanure: estiércol\nripe: maduro"}

,   {"id": "t38", "title": "The Village That Runs on Rain", "level": "B2", "type": "news", "en": "A small village in the mountains of Girona has cut its water use by almost a third in two years, and it has done so without asking anyone to take shorter showers. The change came from the roofs. With a grant from the regional government, the council helped forty families install tanks that collect rainwater and store it under the street. The water is used for gardens, washing machines and, after filtering, for toilets. “People think a drought is something that happens to farmers,” says the mayor. “Actually it happens to everyone who turns on a tap.” Last summer the village did not need the emergency water deliveries that other towns did, and the scheme has become a model for the region. The next step is the school: children will measure the water that falls on the roof every month and write it on a board, so that nobody forgets where it comes from.", "es": "Un poble petit de les muntanyes de Girona ha reduït el consum d'aigua gairebé un terç en dos anys, i ho ha fet sense demanar a ningú dutxes més curtes. El canvi va venir de les teulades. Amb una subvenció del govern autonòmic, l'ajuntament va ajudar quaranta famílies a instal·lar dipòsits que recullen l'aigua de la pluja i l'emmagatzemen sota el carrer. L'aigua es fa servir per als jardins, les rentadores i, després de filtrar-la, per als lavabos. «La gent pensa que una sequera és una cosa que passa als pagesos», diu l'alcalde. «De fet, passa a tothom qui obre una aixeta.» L'estiu passat el poble no va necessitar els enviaments d'emergència d'aigua que sí que van rebre altres municipis, i el sistema s'ha convertit en un model per a la comarca. El proper pas és l'escola: els nens mesuraran cada mes l'aigua que cau sobre la teulada i l'escriuran en un rètol, perquè ningú no oblidi d'on ve.", "keys": "a third: un terç\nshorter showers: dutxes més curtes\ngrant: subvenció\nrooftop: teulada\ndrought: sequera\nto turn on a tap: obrir una aixeta\nemergency deliveries: enviaments d'emergència\nthe scheme: el pla / el sistema"},
  {"id": "t39", "title": "Why the Brain Needs to Sleep on It", "level": "B2+/C1", "type": "news", "en": "Anyone who has revised for an exam at two in the morning knows the feeling: the words are there, and then, a few hours later, they are not. A team at a Barcelona research centre has now filmed what happens in between. During deep sleep, the brain replays the day's experiences many times faster than they happened, strengthening some connections and quietly removing others. The researchers asked volunteers to learn a list of words and then either slept or stayed awake. Those who slept remembered about 25% more. “Sleep is not wasted time,” said the lead author. “It is when the brain decides what is worth keeping.” Her advice is boringly simple: go to bed, leave the phone in another room, and do not try to memorise everything in one night. What matters is not how long you study, she insists, but how many nights you come back to the same material before the exam.", "es": "Qualsevol que hagi repassat per a un examen a les dues de la matinada coneix aquesta sensació: les paraules hi són i, poques hores després, ja no. Un equip d'un centre de recerca de Barcelona ha filmat ara què passa entremig. Durant el son profund, el cervell reprodueix les experiències del dia moltes vegades més de pressa del que van passar, reforçant unes connexions i descartant-ne d'altres en silenci. Els investigadors van demanar als voluntaris que aprenguessin una llista de paraules i després dormissin o es quedessin desperts. Els que van dormir recordaven un 25% més. «El son no és temps perdut», diu l'autora principal. «És quan el cervell decideix què val la pena guardar.» El seu consell és avorridament simple: ves a dormir, deixa el mòbil en una altra habitació i no intentis memoritzar-ho tot en una nit. El que compta no és quantes hores estudies, insisteix, sinó a quantes nits tornes al mateix material abans de l'examen.", "keys": "to revise: repassar (un examen)\nto replay: reproduir / tornar a passar\ndeep sleep: son profund\nto strengthen: reforçar\nto be worth keeping: valer la pena guardar-se\nto stay awake: quedar-se despert\nlead author: autora principal\nboringly simple: avorridament simple\nto memorise: memoritzar"},
  {"id": "t40", "title": "The Man Who Fixes What Others Throw Away", "level": "B2", "type": "story", "en": "Every Saturday morning, Josep opens the doors of the repair café in the old market hall and waits. “It always starts the same way,” he says. “Somebody comes in apologising, holding a lamp or a radio that they are a bit embarrassed to bring.” Then they sit down together and take it apart. Josep is 71 and was an electrician for forty years. Now he helps people repair things that shops tell them are beyond repair. Last month a boy of fourteen arrived with a record player that had belonged to his grandfather. They spent two hours on it; the fault was a single spare part that cost three euros. “The point is not to save money,” Josep explains. “It is that when you fix something, you stop being a customer and become someone who understands.” He also teaches the new repairers, and that, he says, is how a trade is passed on: one table, one Saturday, one broken object at a time.", "es": "Cada dissabte al matí, en Josep obre les portes del cafè de reparacions del vell mercat i espera. «Sempre comença igual», diu. «Algú entra demanant perdó, amb un llum o una ràdio que li fa una mica de vergonya portar.» Llavors s'asseuen junts i el desmunten. En Josep té 71 anys i va ser electricista durant quaranta. Ara ajuda la gent a reparar coses que a les botigues els diuen que no tenen arreglada. El mes passat va arribar un noi de catorze anys amb un tocadiscos que havia estat del seu avi. Hi van passar dues hores; l'avaria era una sola peça de recanvi que costava tres euros. «El que compta no és estalviar diners», explica en Josep. «És que quan arregles una cosa deixes de ser client i et converteixes en algú que entén.» També ensenya els nous reparadors, i diu que així és com es transmet un ofici: una taula, un dissabte, un objecte espatllat cada vegada.", "keys": "repair café: cafè de reparacions\nto apologise: demanar perdó\nto be embarrassed: fer vergonya\nto take apart: desmuntar\nbeyond repair: sense arreglada possible\nspare part: peça de recanvi\nfault: avaria\nto save money: estalviar diners\nto pass on a trade: transmetre un ofici"},
  {"id": "t41", "title": "The Hidden Cost of a Cheap T-shirt", "level": "C1", "type": "news", "en": "Europeans buy, on average, five times as many clothes as they did in 1980, and keep each item for half as long. The consequences are not hard to find. Textiles are now one of the fastest-growing waste streams in the European Union, and much of what is donated to charity shops ends up in lorries heading for the ports of the Baltic or West Africa, where it is sold, sorted again, or simply buried. New rules due to come into force in the coming years will require member states to collect textiles separately and will oblige producers to pay part of the cost of what they put on the market. Sceptics point out that the same promises have been made about plastic packaging for two decades. The most effective change may turn out to be the least spectacular: buying less, choosing clothes that can be repaired, and wearing them for so long that the trend comes back round before the shirt wears out.", "es": "Els europeus compren, de mitjana, cinc vegades més roba que el 1980, i cada peça els dura la meitat. Les conseqüències no costen de trobar. Els tèxtils són ara un dels corrents de residus que creixen més de pressa a la Unió Europea, i bona part del que es dona a les botigues benèfiques acaba en camions cap als ports del Bàltic o de l'Àfrica Occidental, on es ven, es torna a classificar o simplement s'enterra. Unes regles noves que han d'entrar en vigor els propers anys obligaran els estats membres a recollir els tèxtils per separat i forçaran els productors a pagar una part del cost del que posen al mercat. Els escèptics recorden que les mateixes promeses s'han fet sobre els envasos de plàstic durant vint anys. Potser el canvi més efectiu serà el menys espectacular: comprar menys, triar roba que es pugui arreglar i portar-la tants anys que la moda torni abans que la camisa s'espatlli.", "keys": "on average: de mitjana\nto keep an item: conservar una peça\nwaste stream: corrent de residus\ncharity shop: botiga benèfica\nto end up: acabar\nto come into force: entrar en vigor\nmember state: estat membre\nto put on the market: posar al mercat\nsceptic: escèptic\nto wear out: espatllar-se / gastar-se"},
  {"id": "t42", "title": "Working With an AI Assistant", "level": "B2+/C1", "type": "article", "en": "Two years ago, most people in the office wrote every email themselves. Now, in many companies, the first draft of almost everything comes from a machine. What surprises those who work this way is not the speed but the change in habits: the tool is no longer something you open when you are stuck; it is something you open at the start. The people who get the best results tend to do three things. They ask narrow questions rather than wide ones; they give the assistant the context it cannot guess; and they check what comes back instead of trusting it. That last point matters more than it sounds. An assistant that writes confidently will write confidently nonsense, and the difference between a good draft and a costly mistake is often a single fact nobody verified. Perhaps the real skill is not prompting at all, but judgement: knowing what is worth outsourcing, and what you would rather keep in your own hands.", "es": "Fa dos anys, la majoria de la gent de l'oficina escrivia tots els correus ella mateixa. Ara, en moltes empreses, el primer esborrany de gairebé tot surt d'una màquina. El que sorprèn els qui treballen així no és la velocitat, sinó el canvi d'hàbits: l'eina ja no és una cosa que obres quan estàs encallat; és una cosa que obres al començament. La gent que obté els millors resultats sol fer tres coses. Fa preguntes estretes i no pas àmplies; dona a l'assistent el context que no pot endevinar; i comprova què li torna en lloc de confiar-hi. Aquest últim punt és més important del que sembla. Un assistent que escriu amb seguretat escriurà amb seguretat bajanades, i la diferència entre un bon esborrany i un error car sol ser un sol fet que ningú no ha verificat. Potser l'habilitat de veritat no és escriure bones instruccions, sinó el criteri: saber què val la pena delegar i què prefereixes tenir a les teves mans.", "keys": "first draft: primer esborrany\nto be stuck: estar encallat\nnarrow question: pregunta concreta\ncontext: context\nto check / to verify: comprovar / verificar\nconfidently: amb to de convicció\nnonsense: bajanades\nprompting: escriure les instruccions a la IA\njudgement: criteri\nto outsource: delegar"},
  {"id": "t43", "title": "The Last Crossing", "level": "C1", "type": "story", "en": "Eloi has run the ferry across the estuary for forty-one years, since he was nineteen and his father's hands were already too stiff for the rope. He knows the river the way other people know a song: by the places where it slows down, where it hides a sandbank, where it turns cold without warning. In March, the bridge opens, and the crossing will take ninety seconds by car instead of eight minutes by boat. He says he is not sad, and mostly he believes it. What he will miss, he explains, is not the water but the waiting. For eight minutes, twice an hour, he had a small room full of strangers who had nothing to do but look at the same shore he was looking at. Some of them talked. One of them became his wife. A bridge is quicker, he says, pulling the rope for the last time; but nothing happens on a bridge.", "es": "En Eloi ha portat el transbordador a través de l'estuari quaranta-un anys, des que en tenia dinou i les mans del seu pare ja eren massa rígides per a la corda. Coneix el riu com altres persones coneixen una cançó: pels llocs on s'alenteix, on amaga un banc de sorra, on es torna fred sense avisar. Al març s'obre el pont, i el creuament durarà noranta segons en cotxe en comptes de vuit minuts en barca. Diu que no està trist, i la major part del temps se ho creu. El que trobarà a faltar, explica, no és l'aigua sinó l'espera. Durant vuit minuts, dues vegades cada hora, tenia una saleta plena de desconeguts que no tenien res a fer sinó mirar la mateixa riba que mirava ell. Alguns parlaven. Un d'ells es va convertir en la seva dona. Un pont és més ràpid, diu, estirant la corda per darrera vegada; però en un pont no hi passa res.", "keys": "to run a ferry: portar un transbordador\nestuary: estuari\nstiff: rígid\nsandbank: banc de sorra\nwithout warning: sense avisar\ncrossing: travessa / creuament\nto miss: trobar a faltar\nshore: riba\nstrangers: desconeguts\nto pull the rope: estirar la corda"},
  {"id": "t44", "title": "A City Where Cars Are Visitors", "level": "B2", "type": "news", "en": "In 1999, the council of Pontevedra, a city of 83,000 people in Galicia, did something that sounded impossible: it removed cars from the historic centre, and later from most of the rest of the city, and it did not build a single underground car park to replace them. Twenty-five years later, traffic in the centre has fallen by around 90%, and the air is cleaner than in almost any comparable city in Spain. Shops that predicted ruin are still there; the centre has more people living in it than in 1999, not fewer. “People said we would kill the economy,” says the mayor who started it. “What we killed was the noise.” The model is not easy to copy everywhere, and critics say the city is small enough to try things that a metropolis could not. But the central idea travels well: if you make walking the easiest option, most people will take it.", "es": "El 1999, l'ajuntament de Pontevedra, una ciutat de 83.000 habitants a Galícia, va fer una cosa que sonava impossible: va treure els cotxes del centre històric, i després de la major part de la resta de la ciutat, i no va construir ni un sol aparcament subterrani per substituir-los. Vint-i-cinc anys després, el trànsit al centre ha baixat al voltant del 90%, i l'aire és més net que a gairebé qualsevol ciutat comparable d'Espanya. Les botigues que pronosticaven la ruïna hi continuen; al centre hi viu més gent que el 1999, no menys. «Deien que mataríem l'economia», diu l'alcalde que ho va engegar. «El que vam matar va ser el soroll.» El model no és fàcil de copiar a tot arreu, i els crítics diuen que la ciutat és prou petita per provar coses que una metròpoli no podria. Però la idea central viatja bé: si fas que caminar sigui l'opció més fàcil, la majoria de la gent la triarà.", "keys": "council: ajuntament\nto remove: treure\nunderground car park: aparcament subterrani\ntraffic: trànsit\nto fall by: baixar (un percentatge)\ncomparable: comparable\nto predict: pronosticar\nnoise: soroll\nto travel well: funcionar en altres llocs"},
  {"id": "t45", "title": "Why Names Slip Away", "level": "B2+/C1", "type": "article", "en": "You are introduced to someone, you hear the name clearly, you say it back — and three seconds later it is gone. Psychologists call this the next-in-line effect, and it has little to do with a bad memory. When you meet a stranger, your attention is busy with other things: their face, their hand, what you are going to say next. The name arrives in that noise, is stored for a moment, and never reaches the place where names are kept. The fix is not a trick but a small act of attention: repeat the name out loud in the next sentence, link it to something you already know, and use it again before you leave. What you cannot do is listen to a name while you are preparing your own introduction. That, it turns out, is what most of us are doing when we are supposed to be listening.", "es": "Et presenten algú, sents el nom clarament, el repeteixes... i tres segons després ja no hi és. Els psicòlegs en diuen efecte del següent de la fila, i té poc a veure amb tenir mala memòria. Quan coneixes un desconegut, la teva atenció és enfeinada amb altres coses: la seva cara, la seva mà, què diràs tu tot seguit. El nom arriba enmig d'aquest soroll, s'hi guarda un moment, i no arriba mai al lloc on es guarden els noms. L'arranjament no és un truc sinó un petit acte d'atenció: repeteix el nom en veu alta a la frase següent, lliga'l a una cosa que ja saps, i torna'l a fer servir abans de marxar. El que no pots fer és escoltar un nom mentre prepares la teva pròpia presentació. I resulta que és exactament el que fem la majoria quan hauríem d'estar escoltant.", "keys": "to slip away: escapar-se / esvair-se\nto be introduced to: ser presentat a\nto say it back: repetir-ho\nto have to do with: tenir a veure amb\nto store: emmagatzemar\nout loud: en veu alta\nto link to: lligar amb\nit turns out: resulta\nto be supposed to: haver de (en teoria)"}];
// ===== Títols reals i tipus de text (abans molts deien només "Historia / Story") =====
const META={t5:{title:'The Machine That Doubted',type:'story'},t6:{title:'The Machine That Doubted (easier version)',type:'story'},t7:{title:'AI Helps Doctors Detect Heart Problems Earlier',type:'news'},t8:{title:'Imitation or Imagination?',type:'story'},t9:{title:'AI Tool Helps Small Farmers Predict Crop Failures',type:'news'},t10:{title:'A Voice in the Drawer',type:'story'},t11:{title:'AI System Cuts Waiting Times in Emergency Rooms',type:'news'},t12:{title:'An Old Song',type:'story'},t13:{title:'AI Helps Museums Identify Stolen Artworks',type:'news'},t14:{title:'The Bookshop That Changed Just Enough',type:'story'},t15:{title:'AI Translators Bring Ancient Texts Back to Life',type:'news'},t16:{title:'The Machine That Learned to Stay Quiet',type:'story'},t17:{title:'AI Tool Reviews Old Court Cases for Possible Errors',type:'news'},t18:{title:'The Last Exam',type:'story'},t20:{type:'story'},t21:{type:'article'},t22:{type:'story'},t23:{type:'article'},t24:{type:'story'},t25:{type:'article'},t26:{type:'story'},t27:{type:'story'},t28:{type:'article'},t29:{type:'article'}};
initialTexts.forEach(t=>Object.assign(t,META[t.id]||{}));
const TYPES={story:'Història',news:'Notícia',article:'Article'};
const LEVELS=['B2','B2+/C1','C1'];
const DATA_KEY='bilingual_texts_v3',PREF_KEY='lingualab_prefs_v1';
const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeGet=(key,fallback)=>{try{const v=JSON.parse(localStorage.getItem(key));return v??fallback}catch{return fallback}};

let stored=safeGet(DATA_KEY,null);
let texts=Array.isArray(stored)?stored.filter(t=>t&&typeof t==='object'&&typeof t.en==='string'):initialTexts.map(t=>({...t}));
if(Array.isArray(stored)){
  // Migració: posa títols reals i corregeix dos errors als textos de mostra, sense tocar res que hagis editat.
  const byId=new Map(initialTexts.map(t=>[String(t.id),t]));
  for(const t of texts){const o=byId.get(String(t.id));if(!o)continue;
    if(/^(Historia \/ Story|Noticia \/ News)/.test(t.title||''))t.title=o.title;
    if(!t.type)t.type=o.type;
    if(typeof t.keys==='string')t.keys=t.keys.replace('frontier: frontera','the line between: la frontera entre');
    if(typeof t.es==='string')t.es=t.es.replace('Al doctor Ibarra','A la doctora Ibarra');}
  const ids=new Set(texts.map(t=>String(t.id)));for(const t of initialTexts)if(!ids.has(String(t.id))){texts.push({...t});ids.add(String(t.id))}
}
const sysDark=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
const defaults={favorites:[],read:[],known:[],hard:[],theme:sysDark?'dark':'light',stats:{correct:0,answered:0},rate:.9,voice:'',cardMode:'pending',cardDir:'en',quizDir:'en2es'};
let prefs={...defaults,...(safeGet(PREF_KEY,null)||{})};
for(const k of ['favorites','read','known','hard'])if(!Array.isArray(prefs[k]))prefs[k]=[];
if(!prefs.stats||typeof prefs.stats!=='object')prefs.stats={correct:0,answered:0};

let view='library',readerId=null,editId=null,level='all',kind='all',search='',translation=true;
let deck=[],flashIndex=0,flipped=false,cardText=null;
let quizDeck=[],quizIndex=0,quizAnswered=false,quizOpts=null,session={ok:0,n:0};
let speakToken=0,currentSentences=[];

function persist(){try{localStorage.setItem(DATA_KEY,JSON.stringify(texts));localStorage.setItem(PREF_KEY,JSON.stringify(prefs))}catch(e){notify('No s’han pogut desar les dades: revisa l’espai del navegador.')}}
function notify(m){$('toast').textContent=m;$('toast').classList.remove('hide');clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('toast').classList.add('hide'),3200)}
function keywords(t){return String(t.keys||'').split(/\r?\n/).map(s=>{const i=s.indexOf(':');return i<0?null:{en:s.slice(0,i).trim(),es:s.slice(i+1).trim()}}).filter(k=>k&&k.en&&k.es)}
function allWords(){let out=[];for(const t of texts)for(const k of keywords(t))out.push({...k,id:t.id,level:t.level,key:t.id+'::'+k.en.toLowerCase()});return out}
function titleFrom(t){return t.title||'Sense títol'}
function typeOf(t){return TYPES[t.type]?t.type:(/noticia|news/i.test(t.title||'')?'news':'story')}
function wordCount(s){return String(s).trim().split(/\s+/).filter(Boolean).length}
function shuffled(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}
function sentences(s){const raw=String(s).match(/[^.!?]+(?:[.!?]+["”’)\]]*|$)\s*/g)||[String(s)];const out=[];for(const p of raw){if(out.length&&/\b(Dr|Mr|Mrs|Ms|Prof|St)\.\s*$/.test(out[out.length-1]))out[out.length-1]+=p;else out.push(p)}return out.filter(x=>x.trim())}
function reEsc(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}
function kwRegex(keys){if(!keys.length)return null;return new RegExp('\\b('+[...keys].sort((a,b)=>b.en.length-a.en.length).map(k=>reEsc(esc(k.en))).join('|')+')\\b','gi')}
function markKeys(s,re,map){let h=esc(s);if(re)h=h.replace(re,m=>`<mark class="kw" tabindex="0" data-word="${m}" data-tip="${esc(map.get(m.toLowerCase())||'')}">${m}</mark>`);return h}
function exampleFor(w){const t=texts.find(x=>x.id===w.id);if(!t)return '';const s=sentences(t.en).find(x=>x.toLowerCase().includes(w.en.toLowerCase()));if(!s)return '';const re=new RegExp('('+reEsc(esc(w.en))+')','i');return esc(s.trim()).replace(re,'<b>$1</b>')}
function levelSelect(id,disabled=false){return `<select class="select" id="${id}" ${disabled?'disabled':''}><option value="all">Tots els nivells</option>${LEVELS.map(v=>`<option value="${v}" ${level===v?'selected':''}>${v}</option>`).join('')}</select>`}

// ===== Veu =====
const hasTTS='speechSynthesis'in window;let voices=[];
function loadVoices(){voices=hasTTS?speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)||v.lang==='en'):[]}
if(hasTTS){loadVoices();speechSynthesis.addEventListener?.('voiceschanged',()=>{loadVoices();if(view==='reader'&&$('voiceSel'))$('voiceSel').innerHTML=voiceOptions()})}
function pickVoice(){return voices.find(v=>v.name===prefs.voice)||voices.find(v=>/en[-_]GB/i.test(v.lang))||voices[0]||null}
function voiceOptions(){const cur=pickVoice();return voices.length?voices.map(v=>`<option value="${esc(v.name)}" ${cur&&cur.name===v.name?'selected':''}>${esc(v.name)} · ${esc(v.lang)}</option>`).join(''):'<option>Veu per defecte</option>'}
function utter(s){const u=new SpeechSynthesisUtterance(s);u.lang='en-GB';u.rate=Number(prefs.rate)||.9;const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}return u}
function markSent(i){document.querySelectorAll('.sent').forEach(e=>e.classList.toggle('speaking',Number(e.dataset.sent)===i))}
function stopSpeech(){speakToken++;if(hasTTS)speechSynthesis.cancel();markSent(-1)}
function speak(s){if(!hasTTS){notify('Aquest navegador no permet reproducció de veu.');return}stopSpeech();speechSynthesis.speak(utter(s))}
// Llegeix frase a frase: ressalta la frase actual i evita que Chrome talli els textos llargs.
function speakSeq(list,start=0,only=false){if(!hasTTS){notify('Aquest navegador no permet reproducció de veu.');return}stopSpeech();const tok=speakToken;const step=i=>{if(tok!==speakToken)return;if(i>=list.length||(only&&i>start)){markSent(-1);return}markSent(i);const u=utter(list[i]);u.onend=()=>step(i+1);u.onerror=()=>{if(tok===speakToken)markSent(-1)};speechSynthesis.speak(u)};step(start)}

function setView(v){stopSpeech();view=v;readerId=null;editId=null;if(v==='cards'&&cardText===null)deck=[];document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render();scrollTo({top:0,behavior:'instant'})}
function heading(t,s){$('pageTitle').textContent=t;$('pageSub').textContent=s}

// ===== Biblioteca =====
function showLibrary(fav=false){heading(fav?'Els teus favorits':'La teva biblioteca d’anglès',fav?'Els textos que has guardat per tornar-hi.':'Textos bilingües per aprendre vocabulari i comprensió.');const q=search.toLowerCase();const items=texts.filter(t=>(!fav||prefs.favorites.includes(t.id))&&(level==='all'||t.level===level)&&(kind==='all'||typeOf(t)===kind)&&[t.title,t.en,t.es,t.keys].join(' ').toLowerCase().includes(q));
const words=allWords();const known=words.filter(w=>prefs.known.includes(w.key)).length;
$('content').innerHTML=`<div class="grid-stats"><div class="stat"><strong>${texts.length}</strong><span>Textos disponibles</span></div><div class="stat"><strong>${prefs.read.filter(id=>texts.some(t=>t.id===id)).length}</strong><span>Lectures completades</span></div><div class="stat"><strong>${words.length}</strong><span>Paraules per practicar</span></div><div class="stat"><strong>${known}</strong><span>Paraules que ja saps</span></div></div><div class="section-head"><h2>${fav?'Guardats':'Explora els textos'}</h2><span class="muted">${items.length} resultats</span></div><div class="filters"><input class="field" id="searchBox" type="search" placeholder="⌕ Cerca per títol, paraula o contingut..." value="${esc(search)}">${levelSelect('levelBox')}<select class="select" id="kindBox"><option value="all">Tots els tipus</option>${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${kind===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="text-grid">${items.map(t=>{const isFav=prefs.favorites.includes(t.id);return `<article class="text-card"><div class="card-top"><span class="pill">${esc(t.level)}</span><button aria-label="Desar com a favorit" class="icon-btn ${isFav?'saved':''}" data-fav="${esc(t.id)}">${isFav?'★':'☆'}</button></div><div><span class="tag">${TYPES[typeOf(t)]} · ${keywords(t).length} paraules · ≈${Math.max(1,Math.round(wordCount(t.en)/170))} min</span><h3>${esc(titleFrom(t))}</h3></div><p class="excerpt">${esc(t.en.slice(0,165))}${t.en.length>165?'…':''}</p><div class="card-bottom"><span class="tag">${prefs.read.includes(t.id)?'✓ Llegit':'◷ Pendent de llegir'}</span><button class="btn ghost" data-open="${esc(t.id)}">Llegir →</button></div></article>`}).join('')}</div>${!items.length?'<div class="empty">No hi ha textos amb aquests filtres.</div>':''}`;
$('searchBox').addEventListener('input',e=>{search=e.target.value;const pos=e.target.selectionStart;showLibrary(fav);$('searchBox').focus();$('searchBox').setSelectionRange(pos,pos)});$('levelBox').onchange=e=>{level=e.target.value;showLibrary(fav)};$('kindBox').onchange=e=>{kind=e.target.value;showLibrary(fav)}}

// ===== Lectura =====
function readText(id){const t=texts.find(x=>x.id===id);if(!t){setView('library');return}stopSpeech();readerId=id;view='reader';heading('Lectura bilingüe','Llegeix en anglès i comprova la traducció quan ho necessitis.');
const keys=keywords(t),re=kwRegex(keys),map=new Map(keys.map(k=>[esc(k.en).toLowerCase(),k.es]));currentSentences=sentences(t.en);
const idx=texts.findIndex(x=>x.id===id),prev=texts[idx-1],next=texts[idx+1];
$('content').innerHTML=`<div class="reader"><button class="btn back" id="backBtn">← Tornar als textos</button><span class="pill">${esc(t.level)}</span> <span class="tag">${TYPES[typeOf(t)]} · ${wordCount(t.en)} paraules</span><h2 class="reader-title">${esc(titleFrom(t))}</h2><div class="reader-actions"><button class="btn primary" id="speakBtn">▶ Escoltar tot</button><button class="btn" id="stopBtn">■ Aturar</button><select class="select" id="rateSel" title="Velocitat">${[[.7,'0.7× lent'],[.8,'0.8×'],[.9,'0.9×'],[1,'1× normal'],[1.1,'1.1×']].map(([v,l])=>`<option value="${v}" ${Number(prefs.rate)===v?'selected':''}>${l}</option>`).join('')}</select>${hasTTS?`<select class="select" id="voiceSel" title="Veu" style="max-width:220px">${voiceOptions()}</select>`:''}<button class="btn" id="toggleTrans">${translation?'◧ Amagar':'◨ Mostrar'} traducció</button><button class="btn" id="completeBtn">${prefs.read.includes(id)?'✓ Lectura completada':'✓ Marcar com a llegit'}</button><button class="btn" id="editTextBtn">✎ Editar</button></div><p class="hint">Toca una frase per escoltar-la sola (bo per fer <i>shadowing</i>). Passa el ratolí o toca les paraules subratllades per veure’n la traducció.</p><div class="reading-layout ${translation?'':'single'}"><section class="reading-block"><h3>English</h3><p>${currentSentences.map((s,i)=>`<span class="sent" data-sent="${i}">${markKeys(s,re,map)}</span>`).join('')}</p></section><section class="reading-block ${translation?'':'hide'}" id="esBlock"><h3>Español</h3><p>${esc(t.es)}</p></section></div><div class="section-head"><h2>Vocabulari clau</h2><button class="btn ghost" id="practiceText" ${keys.length?'':'disabled'}>▣ Practica aquestes ${keys.length} paraules</button></div><div class="vocab-list">${keys.map(k=>`<button class="vocab-chip" data-word="${esc(k.en)}"><strong>${esc(k.en)}</strong> → ${esc(k.es)} 🔊</button>`).join('')}</div><div class="reader-nav">${prev?`<button class="btn" data-open="${esc(prev.id)}">← ${esc(titleFrom(prev))}</button>`:'<span></span>'}${next?`<button class="btn" data-open="${esc(next.id)}">${esc(titleFrom(next))} →</button>`:''}</div></div>`;
$('backBtn').onclick=()=>setView('library');$('speakBtn').onclick=()=>speakSeq(currentSentences);$('stopBtn').onclick=stopSpeech;
$('rateSel').onchange=e=>{prefs.rate=Number(e.target.value);persist()};if($('voiceSel'))$('voiceSel').onchange=e=>{prefs.voice=e.target.value;persist();speak('This is how I sound.')};
$('toggleTrans').onclick=()=>{translation=!translation;readText(id)};$('completeBtn').onclick=()=>{if(!prefs.read.includes(id))prefs.read.push(id);else prefs.read=prefs.read.filter(x=>x!==id);persist();readText(id)};$('editTextBtn').onclick=()=>editForm(id);
$('practiceText').onclick=()=>{cardText=id;deck=[];setView('cards')}}

// ===== Flashcards =====
function buildDeck(){let w=allWords().filter(x=>cardText?x.id===cardText:(level==='all'||x.level===level));if(prefs.cardMode==='pending')w=w.filter(x=>!prefs.known.includes(x.key));else if(prefs.cardMode==='hard')w=w.filter(x=>prefs.hard.includes(x.key));deck=shuffled(w);flashIndex=0;flipped=false}
function flip(){flipped=!flipped;showCards()}
function nextCard(d=1){if(!deck.length)return;flashIndex=(flashIndex+d+deck.length)%deck.length;flipped=false;showCards()}
function markKnown(){const w=deck[flashIndex];if(!w)return;if(prefs.known.includes(w.key)){prefs.known=prefs.known.filter(x=>x!==w.key);persist();showCards();return}prefs.known.push(w.key);prefs.hard=prefs.hard.filter(x=>x!==w.key);persist();if(prefs.cardMode==='pending'){deck.splice(flashIndex,1);if(flashIndex>=deck.length)flashIndex=0;flipped=false;showCards()}else nextCard(1)}
function markHard(){const w=deck[flashIndex];if(!w)return;if(prefs.hard.includes(w.key)){prefs.hard=prefs.hard.filter(x=>x!==w.key);persist();if(prefs.cardMode==='hard'){deck.splice(flashIndex,1);if(flashIndex>=deck.length)flashIndex=0;flipped=false;showCards()}else showCards();return}prefs.hard.push(w.key);persist();nextCard(1)}
function showCards(){heading('Flashcards de vocabulari','Recorda primer el significat i després gira la targeta.');if(!deck.length&&!showCards.built)buildDeck();showCards.built=false;const w=deck[flashIndex];const enFront=prefs.cardDir!=='es';const ct=cardText&&texts.find(t=>t.id===cardText);
const modes=[['pending','Per aprendre'],['all','Totes'],['hard','Difícils']];
$('content').innerHTML=`<div class="practice"><div class="tabs">${levelSelect('cardLevel',!!ct)}<div class="seg">${modes.map(([k,l])=>`<button data-mode="${k}" class="${prefs.cardMode===k?'on':''}">${l}</button>`).join('')}</div><button class="btn" id="dirBtn">${enFront?'EN → ES':'ES → EN'}</button><button class="btn" id="shuffleBtn">⤨ Barrejar</button></div>${ct?`<div class="banner">Vocabulari de: <b>${esc(titleFrom(ct))}</b> <button class="btn" id="clearText">✕ Totes les paraules</button></div>`:''}
${w?`<p class="mini" style="margin-top:18px">Targeta ${flashIndex+1} de ${deck.length} · ${esc(w.level)}${prefs.hard.includes(w.key)?' · ★ difícil':''}</p><div class="progress-track"><div style="width:${100*(flashIndex+1)/deck.length}%"></div></div><button class="flash" id="flipCard"><span>${flipped?'Resposta':(enFront?'Què vol dir en castellà?':'Com es diu en anglès?')}</span><strong>${esc(flipped?(enFront?w.es:w.en):(enFront?w.en:w.es))}</strong>${flipped&&exampleFor(w)?`<p class="example">“${exampleFor(w)}”</p>`:''}<span>↻ Toca per girar</span></button><div class="answer"><button class="btn" id="speakWord">🔊 Pronunciar</button><button class="btn" id="nextCard">Següent →</button><button class="btn danger" id="hardCard">${prefs.hard.includes(w.key)?'Treure de difícils':'☆ Difícil'}</button><button class="btn primary" id="knownCard">${prefs.known.includes(w.key)?'↺ Tornar a aprendre':'✓ La sé'}</button></div><div class="kbd">Teclat: espai = girar · ← → = anterior/següent · K = la sé · D = difícil · P = pronunciar</div>`
:`<div class="empty" style="margin-top:20px">${prefs.cardMode==='pending'?'🎉 Ja coneixes totes les paraules d’aquesta selecció.<br><br><button class="btn primary" data-mode="all">Repassar-les totes</button>':prefs.cardMode==='hard'?'No tens paraules marcades com a difícils aquí. Al quiz, les que falles s’hi afegeixen soles.':'No hi ha paraules per a aquesta selecció.'}</div>`}</div>`;
$('cardLevel').onchange=e=>{level=e.target.value;buildDeck();showCards.built=true;showCards()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{prefs.cardMode=b.dataset.mode;persist();buildDeck();showCards.built=true;showCards()});
$('dirBtn').onclick=()=>{prefs.cardDir=enFront?'es':'en';persist();flipped=false;showCards()};$('shuffleBtn').onclick=()=>{buildDeck();showCards.built=true;showCards()};if($('clearText'))$('clearText').onclick=()=>{cardText=null;buildDeck();showCards.built=true;showCards()};
if(w){$('flipCard').onclick=flip;$('speakWord').onclick=()=>speak(w.en);$('nextCard').onclick=()=>nextCard(1);$('hardCard').onclick=markHard;$('knownCard').onclick=markKnown}}

// ===== Quiz =====
function resetQuiz(){quizDeck=shuffled(allWords().filter(x=>level==='all'||x.level===level));quizIndex=0;quizAnswered=false;quizOpts=null}
function nextQuestion(){quizIndex++;if(quizIndex>=quizDeck.length){resetQuiz();notify('Ronda completada! Tornem a barrejar.')}quizAnswered=false;quizOpts=null;showQuiz()}
function answerQuiz(i){const w=quizDeck[quizIndex];if(quizAnswered||!w||!quizOpts||i>=quizOpts.length)return;const en2es=prefs.quizDir!=='es2en',ans=en2es?w.es:w.en;quizAnswered=true;const ok=quizOpts[i]===ans;prefs.stats.answered++;session.n++;if(ok){prefs.stats.correct++;session.ok++}else if(!prefs.hard.includes(w.key))prefs.hard.push(w.key);persist();
document.querySelectorAll('[data-answer]').forEach((o,j)=>{o.disabled=true;if(quizOpts[j]===ans)o.classList.add('correct');else if(j===i)o.classList.add('wrong')});const ex=exampleFor(w);
$('quizFeedback').innerHTML=(ok?'<b style="color:var(--green)">✓ Correcte!</b>':`✗ La resposta correcta és: <b>${esc(ans)}</b> · afegida a difícils`)+(ex?`<p class="example" style="margin:10px auto 0">“${ex}”</p>`:'');$('nextQuiz').classList.remove('hide');$('nextQuiz').focus();speak(w.en)}
function showQuiz(){heading('Posa’t a prova','Tria la traducció correcta i reforça el vocabulari.');if(!quizDeck.length)resetQuiz();const w=quizDeck[quizIndex];const en2es=prefs.quizDir!=='es2en';
if(w&&!quizOpts){const ans=en2es?w.es:w.en;const pool=[...new Set(allWords().map(x=>en2es?x.es:x.en))].filter(x=>x.toLowerCase()!==ans.toLowerCase());quizOpts=shuffled([ans,...shuffled(pool).slice(0,3)])}
const total=prefs.stats.answered||0,correct=prefs.stats.correct||0,pct=total?Math.round(correct/total*100):0;
$('content').innerHTML=`<div class="practice"><div class="tabs">${levelSelect('quizLevel')}<div class="seg"><button data-qdir="en2es" class="${en2es?'on':''}">EN → ES</button><button data-qdir="es2en" class="${en2es?'':'on'}">ES → EN</button></div></div>${w?`<div class="mini" style="margin-top:18px">Aquesta sessió: ${session.ok}/${session.n} · Total: ${correct}/${total} (${pct}%) · Pregunta ${quizIndex+1} de ${quizDeck.length}</div><div class="progress-track" style="margin:16px 0"><div style="width:${pct}%"></div></div><p class="mini">${en2es?'Com traduiries aquesta expressió?':'Com es diu en anglès?'}</p><h2 style="font-size:clamp(26px,4vw,38px);margin:22px 0">${esc(en2es?w.en:w.es)}</h2><div id="quizOpts">${quizOpts.map((x,i)=>`<button class="quiz-option" data-answer="${i}"><span class="muted">${i+1}.</span> ${esc(x)}</button>`).join('')}</div><div id="quizFeedback" class="muted" style="min-height:30px;margin-top:12px"></div><button class="btn primary hide" id="nextQuiz">Següent pregunta →</button><div class="kbd">Teclat: 1–4 per respondre · Enter per continuar</div>`:'<div class="empty" style="margin-top:20px">Afegeix textos amb vocabulari per practicar.</div>'}</div>`;
$('quizLevel').onchange=e=>{level=e.target.value;resetQuiz();showQuiz()};document.querySelectorAll('[data-qdir]').forEach(b=>b.onclick=()=>{prefs.quizDir=b.dataset.qdir;persist();quizOpts=null;quizAnswered=false;showQuiz()});
if(!w)return;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answerQuiz(Number(b.dataset.answer)));$('nextQuiz').onclick=nextQuestion}

// ===== Editor =====
function editForm(id=null){stopSpeech();editId=id;view='editor';const t=id?texts.find(x=>x.id===id):null;const ty=t?typeOf(t):'story';heading(t?'Editar text':'Afegir un text nou','Organitza els textos i les paraules clau.');$('content').innerHTML=`<div class="panel"><form id="editorForm" class="form-grid"><div class="full"><label for="titleF">Títol</label><input class="field" id="titleF" required value="${esc(t?.title||'')}" placeholder="Títol del text"></div><div><label for="levelF">Nivell</label><select class="field" id="levelF">${LEVELS.map(l=>`<option ${t?.level===l?'selected':''}>${l}</option>`).join('')}</select></div><div><label for="typeF">Tipus</label><select class="field" id="typeF">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${ty===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="full"><label for="enF">Text en anglès</label><textarea class="field" id="enF" required placeholder="English text...">${esc(t?.en||'')}</textarea></div><div class="full"><label for="esF">Traducció al castellà</label><textarea class="field" id="esF" required placeholder="Texto en español...">${esc(t?.es||'')}</textarea></div><div class="full"><label for="keysF">Vocabulari (una expressió per línia: anglès: castellà)</label><textarea class="field" id="keysF" placeholder="come across: encontrar por casualidad">${esc(t?.keys||'')}</textarea></div><div class="full" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn primary" type="submit">Desar text</button><button class="btn" type="button" id="cancelEdit">Cancel·lar</button>${t?'<button class="btn danger" type="button" id="deleteText">Eliminar text</button>':''}</div></form></div>`;
$('cancelEdit').onclick=()=>t?readText(t.id):setView('library');$('editorForm').onsubmit=e=>{e.preventDefault();const v={title:$('titleF').value.trim(),level:$('levelF').value,type:$('typeF').value,en:$('enF').value.trim(),es:$('esF').value.trim(),keys:$('keysF').value.trim()};if(!v.title||!v.en||!v.es){notify('Cal completar títol i els dos textos.');return}if(t)Object.assign(t,v);else texts.unshift({id:'custom_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),...v});persist();deck=[];resetQuiz();notify('Text desat correctament');setView('library')};
if(t)$('deleteText').onclick=()=>{if(confirm('Vols eliminar aquest text? Aquesta acció no es pot desfer sense una còpia de seguretat.')){texts=texts.filter(x=>x.id!==id);persist();deck=[];resetQuiz();notify('Text eliminat');setView('library')}}}

// ===== Gestió =====
function downloadBackup(){const obj={application:'LinguaLab',version:2,date:new Date().toISOString(),texts,prefs};const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='lingualab-copia-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function showManage(){heading('Gestiona el teu aprenentatge','Importa, exporta i organitza la biblioteca.');$('content').innerHTML=`<div class="panel"><h2>Les teves dades</h2><p class="muted">La informació es desa localment al navegador, no se sincronitza automàticament entre dispositius. Si esborres les dades del navegador, pots perdre el progrés i els textos afegits.</p><div class="reader-actions"><button class="btn primary" id="exportBtn">↓ Exportar còpia JSON</button><button class="btn" id="importBtn">↑ Importar còpia JSON</button><button class="btn" id="newBtn">＋ Afegir text</button></div><div class="notice">Importar una còpia substitueix els textos i el progrés actual. Exporta primer les dades existents per seguretat.</div><div class="section-head"><h2>Progrés</h2></div><p>Lectures completades: <b>${prefs.read.length}</b> · Paraules conegudes: <b>${prefs.known.length}</b> · Paraules difícils: <b>${prefs.hard.length}</b></p><p>Respostes correctes al quiz: <b>${prefs.stats.correct||0}/${prefs.stats.answered||0}</b></p><div class="reader-actions"><button class="btn" id="resetKnown">↺ Tornar a aprendre totes les paraules</button><button class="btn" id="resetStats">↺ Posar a zero el quiz</button></div><div class="section-head"><h2>Biblioteca inicial</h2></div><p class="muted">Si abans tenies textos desats amb aquesta web, es mantenen en aquest navegador. Pots restaurar la biblioteca inclosa en aquesta versió sense modificar la resta de preferències.</p><button class="btn danger" id="resetBtn">Restaurar textos de mostra</button></div>`;
$('exportBtn').onclick=downloadBackup;$('importBtn').onclick=()=>$('importInput').click();$('newBtn').onclick=()=>editForm();
$('resetKnown').onclick=()=>{if(confirm('Vols que totes les paraules tornin a sortir com a pendents?')){prefs.known=[];persist();deck=[];showManage()}};$('resetStats').onclick=()=>{if(confirm('Vols posar a zero les estadístiques del quiz?')){prefs.stats={correct:0,answered:0};session={ok:0,n:0};persist();showManage()}};
$('resetBtn').onclick=()=>{if(confirm('Vols substituir els textos actuals pels textos originals recuperats? Fes abans una còpia de seguretat.')){texts=initialTexts.map(t=>({...t}));persist();deck=[];resetQuiz();notify('Textos de mostra restaurats');showManage()}}}
$('importInput').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const obj=JSON.parse(await f.text());const arr=Array.isArray(obj)?obj:obj.texts;if(!Array.isArray(arr)||!arr.every(x=>x&&typeof x.title==='string'&&typeof x.en==='string'&&typeof x.es==='string'))throw Error('Format incorrecte');if(!confirm('Substituir els textos i el progrés actuals pels de la còpia importada?'))return;texts=arr.map(x=>({...x,id:String(x.id||'import_'+Math.random().toString(36).slice(2)),level:String(x.level||'B2'),keys:String(x.keys||'')}));if(obj.prefs&&typeof obj.prefs==='object')prefs={...prefs,...obj.prefs};persist();deck=[];resetQuiz();notify('Còpia importada correctament');setView('library')}catch(err){notify('No s’ha pogut importar: '+err.message)}finally{e.target.value=''}};

function render(){if(view==='library')showLibrary();else if(view==='favorites')showLibrary(true);else if(view==='reader')readText(readerId);else if(view==='cards')showCards();else if(view==='quiz')showQuiz();else if(view==='manage')showManage();else if(view==='editor')editForm(editId)}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){if(nav.dataset.view==='cards')cardText=null;setView(nav.dataset.view);return}const op=e.target.closest('[data-open]');if(op){readText(op.dataset.open);scrollTo(0,0);return}const fav=e.target.closest('[data-fav]');if(fav){const id=fav.dataset.fav;prefs.favorites=prefs.favorites.includes(id)?prefs.favorites.filter(x=>x!==id):[...prefs.favorites,id];persist();render();return}const word=e.target.closest('[data-word]');if(word){speak(word.dataset.word);return}const s=e.target.closest('[data-sent]');if(s)speakSeq(currentSentences,Number(s.dataset.sent),true)});
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey||e.target.closest('input,textarea,select'))return;if(e.target.closest('button')&&(e.key===' '||e.key==='Enter'))return;const k=e.key.toLowerCase();
if(view==='cards'&&deck.length){if(e.key===' '){e.preventDefault();flip()}else if(e.key==='ArrowRight')nextCard(1);else if(e.key==='ArrowLeft')nextCard(-1);else if(k==='k')markKnown();else if(k==='d')markHard();else if(k==='p')speak(deck[flashIndex].en)}
else if(view==='quiz'){if(!quizAnswered&&/^[1-4]$/.test(e.key))answerQuiz(Number(e.key)-1);else if(quizAnswered&&(e.key==='Enter'||e.key==='ArrowRight'))nextQuestion()}
else if(view==='reader'&&e.key==='Escape')stopSpeech()});
function applyTheme(){document.documentElement.dataset.theme=prefs.theme==='dark'?'dark':'light';$('themeBtn').textContent=prefs.theme==='dark'?'☀ Tema':'☾ Tema'}
$('addBtn').onclick=()=>editForm();$('themeBtn').onclick=()=>{prefs.theme=prefs.theme==='dark'?'light':'dark';applyTheme();persist()};applyTheme();render();
</script><script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body></html>
