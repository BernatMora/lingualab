    id: "t5", title: "Historia / Story", level: "C1",
    en: "Dr. Elena Vasquez had spent a decade teaching machines to recognize irony, and she had come to suspect the endeavor was fundamentally quixotic. Language, after all, thrived on ambiguity; the more precisely a model parsed a sentence, the more it seemed to miss the point. One evening, exasperated by yet another failed test case, she typed a deliberately sarcastic remark into the system and awaited the inevitable misclassification. Instead, the model paused—or rather, its output stream faltered—and returned: \"I detect irony, but I am not certain you intended it.\" Elena sat back, unsettled. It was not the accuracy that disturbed her, but the hesitation: a machine entertaining doubt felt less like a triumph of engineering and more like an uncanny mirror held up to her own mind.",
    es: "La Dra. Elena Vásquez había pasado una década enseñando a las máquinas a reconocer la ironía, y había llegado a sospechar que el empeño era fundamentalmente quijotesco. Al fin y al cabo, el lenguaje prosperaba gracias a la ambigüedad; cuanto más precisamente analizaba un modelo una frase, más parecía perder el sentido. Una tarde, exasperada por otro caso de prueba fallido, escribió un comentario deliberadamente sarcástico en el sistema y aguardó la inevitable clasificación errónea. En cambio, el modelo se detuvo —o más bien, su flujo de salida titubeó— y respondió: \"Detecto ironía, pero no estoy seguro de que fuera su intención\". Elena se recostó, inquieta. No fue la precisión lo que la perturbó, sino la vacilación: una máquina que albergaba dudas se parecía menos a un triunfo de la ingeniería y más a un espejo inquietante alzado frente a su propia mente.",
    keys: "quixotic: quijotesco\nthrived on: prosperaba gracias a\nexasperated: exasperada\nfaltered: titubeó\nuncanny: inquietante"
  },
  {
    id: "t6", title: "Historia / Story", level: "B2",
    en: "Elena had spent years teaching computers to understand jokes, and she was starting to think it was impossible. Language depends so much on context, she often told her students, that even people misunderstand each other all the time. One evening, tired after another failed test, she typed a sarcastic comment into the system and waited for the usual mistake. But this time the machine answered: \"I think you are being ironic, but I'm not completely sure.\" Elena stared at the screen. It wasn't the correct answer that surprised her. It was the doubt. For a moment, the machine seemed less like a tool and more like a mirror of her own mind.",
    es: "Elena había pasado años enseñando a los ordenadores a entender chistes, y empezaba a pensar que era imposible. El lenguaje depende tanto del contexto, les decía a menudo a sus estudiantes, que incluso las personas se malinterpretan todo el tiempo. Una tarde, cansada tras otra prueba fallida, escribió un comentario sarcástico en el sistema y esperó el error de siempre. Pero esta vez la máquina respondió: \"Creo que estás siendo irónico, pero no estoy completamente seguro\". Elena se quedó mirando la pantalla. No fue la respuesta correcta lo que la sorprendió. Fue la duda. Por un momento, la máquina le pareció menos una herramienta y más un espejo de su propia mente.",

    id: "t7", title: "Noticia / News", level: "B2",
    en: "AI Helps Doctors Detect Heart Problems Earlier. A hospital in Barcelona has started using artificial intelligence to help doctors find heart problems earlier. The system studies thousands of medical tests and looks for small warning signs that are easy to miss. In a six-month trial, the AI helped identify 30 patients who needed urgent care. Doctors say the tool is useful because it works fast and never gets tired, but they insist that the final decision is always made by a person. \"The AI gives us a warning, but we decide what to do,\" said one cardiologist. The hospital plans to use the system in more departments next year.",
    es: "Una IA ayuda a los médicos a detectar antes los problemas del corazón. Un hospital de Barcelona ha empezado a usar inteligencia artificial para ayudar a los médicos a encontrar antes los problemas del corazón. El sistema estudia miles de pruebas médicas y busca pequeñas señales de alerta que son fáciles de pasar por alto. En una prueba de seis meses, la IA ayudó a identificar a 30 pacientes que necesitaban atención urgente. Los médicos dicen que la herramienta es útil porque funciona rápido y nunca se cansa, pero insisten en que la decisión final siempre la toma una persona. \"La IA nos da un aviso, pero nosotros decidimos qué hacer\", dijo un cardiólogo. El hospital planea usar el sistema en más departamentos el año que viene.",

    id: "t8", title: "Historia / Story", level: "B2+/C1",
    en: "Tomás had always assumed that a machine could never truly surprise him. He had built dozens of models, tuned them, corrected their errors, and learned to predict their failures with almost boring accuracy. So when his latest assistant, designed to help students write essays, produced a sentence he had never taught it—an elegant, slightly melancholic observation about loneliness and screens—he felt a strange discomfort. It was not that the sentence was wrong. On the contrary, it was better than anything he might have written himself. What unsettled him was the possibility that the machine had stumbled onto something he had not fully understood: that the line between imitation and imagination is thinner than he had ever been willing to admit.",
    es: "Tomás siempre había dado por sentado que una máquina jamás podría sorprenderle de verdad. Había construido decenas de modelos, los había ajustado, corregido sus errores y aprendido a prever sus fallos con una precisión casi aburrida. Así que cuando su último asistente, diseñado para ayudar a los estudiantes a escribir ensayos, produjo una frase que nunca le había enseñado —una observación elegante y ligeramente melancólica sobre la soledad y las pantallas— sintió una incomodidad extraña. No es que la frase estuviera mal. Al contrario, era mejor que cualquier cosa que él mismo habría escrito. Lo que le inquietaba era la posibilidad de que la máquina hubiera topado con algo que él no había entendido del todo: que la frontera entre la imitación y la imaginación es más fina de lo que nunca había estado dispuesto a admitir.",
    keys: "assumed: daba por sentado\ntuned: ajustado\nmelancholic: melancólica\nunsettled: inquietaba\nstumbled onto: topó con\nthe line between: la frontera entre"

  {
    id: "t9", title: "Noticia / News", level: "B2+/C1",
    en: "AI Tool Helps Small Farmers Predict Crop Failures. A startup based in Valencia has developed an artificial intelligence tool that helps small farmers anticipate crop failures before they become visible. The system combines satellite images, local weather data, and soil sensors to estimate the risk of drought or disease, then sends simple alerts to farmers' phones. During a pilot programme involving 200 farms, users reported losing significantly less produce than in previous seasons. The developers stress that the tool is not meant to replace traditional knowledge, but to complement it. \"Farmers know their land better than any algorithm,\" said the company's founder. \"We simply give them a little more time to react.\" The service is expected to expand to Portugal and southern France later this year.",
    es: "Una herramienta de IA ayuda a los pequeños agricultores a prever malas cosechas. Una empresa emergente con sede en Valencia ha desarrollado una herramienta de inteligencia artificial que ayuda a los pequeños agricultores a anticipar malas cosechas antes de que sean visibles. El sistema combina imágenes por satélite, datos meteorológicos locales y sensores del suelo para estimar el riesgo de sequía o enfermedad, y después envía alertas sencillas al teléfono de los agricultores. Durante un programa piloto con 200 explotaciones, los usuarios informaron de pérdidas de producción significativamente menores que en temporadas anteriores. Los desarrolladores insisten en que la herramienta no pretende sustituir el conocimiento tradicional, sino complementarlo. \"Los agricultores conocen su tierra mejor que cualquier algoritmo\", afirmó el fundador de la empresa. \"Simplemente les damos un poco más de tiempo para reaccionar.\" Está previsto que el servicio se amplíe a Portugal y al sur de Francia a finales de este año.",
    keys: "anticipate: prever\ncrop failures: malas cosechas\nsoil sensors: sensores del suelo\npilot programme: programa piloto\nproduce: productos agrícolas\ncomplement: complementar\nfounder: fundador"
  },
  {
    id: "t10", title: "Historia / Story", level: "B2+/C1",
    en: "Lucía had never been particularly fond of technology. She used it, of course—everyone did—but she rarely trusted it. So when her daughter gave her a small AI device designed to keep elderly people company, she left it in a drawer for three weeks. One rainy afternoon, out of sheer boredom, she switched it on. The device asked her about her day, and she answered reluctantly. The next day it remembered what she had said. By the end of the month, Lucía found herself looking forward to their conversations, though she would never have admitted it. What surprised her most was not that the machine listened, but that it made her feel heard—a feeling she had almost forgotten was possible.",
    es: "Lucía nunca había sido especialmente aficionada a la tecnología. La usaba, claro —todo el mundo lo hacía—, pero rara vez confiaba en ella. Así que cuando su hija le regaló un pequeño dispositivo de IA diseñado para hacer compañía a las personas mayores, lo dejó en un cajón durante tres semanas. Una tarde lluviosa, por puro aburrimiento, lo encendió. El dispositivo le preguntó por su día y ella respondió a regañadientes. Al día siguiente recordaba lo que había dicho. A finales de mes, Lucía se sorprendió a sí misma esperando con ganas sus conversaciones, aunque jamás lo habría admitido. Lo que más la sorprendió no fue que la máquina escuchara, sino que la hiciera sentirse escuchada: un sentimiento que casi había olvidado que era posible.",
    keys: "fond of: aficionada a\nrarely: rara vez\nout of sheer boredom: por puro aburrimiento\nreluctantly: a regañadientes\nlooking forward to: esperar con ganas\nfeel heard: sentirse escuchada"
  },
  {
    id: "t11", title: "Noticia / News", level: "B2+/C1",
    en: "AI System Cuts Waiting Times in Emergency Rooms. A network of hospitals in northern Spain has reported a significant drop in emergency room waiting times after introducing an AI system that helps staff prioritize patients. The tool analyses symptoms, medical history, and real-time data to estimate which cases are most urgent, allowing doctors to focus on those who need immediate attention. During a four-month trial, average waiting times fell by nearly twenty percent, and the number of serious cases left unattended for too long dropped sharply. Hospital directors have welcomed the results, though some nurses remain cautious, warning that no algorithm can fully capture the complexity of a patient's condition. The system will be rolled out to six more hospitals in the coming months.",
    es: "Un sistema de IA reduce los tiempos de espera en urgencias. Una red de hospitales del norte de España ha registrado una caída significativa en los tiempos de espera de urgencias tras introducir un sistema de IA que ayuda al personal a priorizar a los pacientes. La herramienta analiza síntomas, historial médico y datos en tiempo real para estimar qué casos son más urgentes, lo que permite a los médicos centrarse en quienes necesitan atención inmediata. Durante una prueba de cuatro meses, los tiempos de espera medios cayeron casi un veinte por ciento, y el número de casos graves desatendidos durante demasiado tiempo se redujo notablemente. Los directores de los hospitales han acogido los resultados con satisfacción, aunque algunos enfermeros se muestran cautelosos y advierten de que ningún algoritmo puede captar del todo la complejidad del estado de un paciente. El sistema se extenderá a seis hospitales más en los próximos meses.",
    keys: "significant drop: caída significativa\nprioritize: priorizar\nreal-time data: datos en tiempo real\nunattended: desatendidos\ndropped sharply: se redujo notablemente\ncautious: cautelosos\nrolled out: implantado"

    id: "t12", title: "Historia / Story", level: "B2+/C1",
    en: "Mateo had spent the whole summer trying to teach his grandfather how to use a voice assistant. The old man resisted at first, convinced that talking to a machine was both pointless and slightly ridiculous. \"If I want to know the weather, I look out the window,\" he would grumble. But one morning, Mateo overheard him asking the device, almost shyly, to play an old song from his youth. The assistant obeyed, and for a moment his grandfather sat completely still, as if the melody had opened a door he had kept closed for years. He never mentioned it afterwards, and Mateo never brought it up. Some things, he realised, don't need to be discussed to be understood.",
    es: "Mateo había pasado todo el verano intentando enseñar a su abuelo a usar un asistente de voz. El anciano se resistió al principio, convencido de que hablar con una máquina era a la vez inútil y un poco ridículo. \"Si quiero saber el tiempo, miro por la ventana\", refunfuñaba. Pero una mañana, Mateo lo oyó preguntarle al dispositivo, casi con timidez, que pusiera una vieja canción de su juventud. El asistente obedeció, y por un momento su abuelo se quedó completamente quieto, como si la melodía hubiera abierto una puerta que había mantenido cerrada durante años. Nunca lo mencionó después, y Mateo nunca sacó el tema. Algunas cosas, se dio cuenta, no necesitan hablarse para ser entendidas.",
    keys: "resisted: se resistió\npointless: inútil\ngrumble: refunfuñar\noverheard: oyó por casualidad\nshyly: con timidez\nobeyed: obedeció\nbrought it up: sacó el tema\nrealised: se dio cuenta"
  },
  {
    id: "t13", title: "Noticia / News", level: "B2+/C1",
    en: "AI Helps Museums Identify Stolen Artworks. A group of European museums has begun using an artificial intelligence system to track down stolen artworks that occasionally resurface at auctions or in private collections. The tool compares images of objects for sale with a vast database of missing pieces, analysing details such as brushstrokes, materials, and signs of damage. In its first year, the system flagged more than forty suspicious items, several of which were later confirmed as stolen. Curators describe the technology as a useful safety net rather than a substitute for expert judgment, since a machine can miss the historical context that often reveals a forgery. \"It points us in the right direction,\" one curator explained, \"but the final word still belongs to human eyes.\" The network now hopes to extend the database to include smaller regional museums.",
    es: "Una IA ayuda a los museos a identificar obras de arte robadas. Un grupo de museos europeos ha empezado a utilizar un sistema de inteligencia artificial para localizar obras de arte robadas que a veces reaparecen en subastas o en colecciones privadas. La herramienta compara imágenes de los objetos en venta con una enorme base de datos de piezas desaparecidas, analizando detalles como las pinceladas, los materiales y las señales de deterioro. En su primer año, el sistema señaló más de cuarenta artículos sospechosos, varios de los cuales fueron confirmados después como robados. Los conservadores describen la tecnología como una red de seguridad útil más que como un sustituto del criterio experto, ya que una máquina puede pasar por alto el contexto histórico que a menudo revela una falsificación. \"Nos orienta en la dirección correcta\", explicó un conservador, \"pero la última palabra sigue siendo de los ojos humanos\". La red espera ahora ampliar la base de datos para incluir museos regionales más pequeños.",
    keys: "track down: localizar\nresurface: reaparecer\nauctions: subastas\nvast: enorme\nbrushstrokes: pinceladas\nflagged: señaló\ncurators: conservadores\nsafety net: red de seguridad\nforgery: falsificación"
  },
  {
    id: "t14", title: "Historia / Story", level: "B2+/C1",
    en: "The old bookshop had been in the family for three generations, and Nora knew every shelf by heart. When a developer offered to buy the building and turn it into luxury flats, she refused without hesitation. But as the months passed and the bills piled up, her certainty began to waver. One evening, a quiet customer asked whether she had ever considered selling online. Nora laughed at first—what could the internet possibly understand about the smell of old paper, the weight of a well-worn novel? Yet the idea lingered. By spring, she had launched a small website, and to her astonishment, orders began to arrive from cities she had never visited. The shop survived, though not quite as she had imagined. Some traditions, she learned, endure not by staying the same, but by changing just enough.",
    es: "La vieja librería llevaba tres generaciones en la familia, y Nora conocía cada estante de memoria. Cuando un promotor inmobiliario le ofreció comprar el edificio y convertirlo en pisos de lujo, se negó sin dudar. Pero a medida que pasaban los meses y se acumulaban las facturas, su certeza empezó a tambalearse. Una tarde, un cliente discreto le preguntó si alguna vez había pensado en vender por internet. Nora se rio al principio: ¿qué podía entender internet del olor del papel viejo, del peso de una novela gastada? Sin embargo, la idea se le quedó dando vueltas. En primavera había lanzado una pequeña web y, para su asombro, empezaron a llegar pedidos de ciudades que nunca había visitado. La librería sobrevivió, aunque no exactamente como ella había imaginado. Algunas tradiciones, aprendió, perduran no por mantenerse iguales, sino por cambiar lo justo.",
    keys: "by heart: de memoria\nwithout hesitation: sin dudar\npiled up: se acumulaban\nwaver: tambalearse\nlingered: persistió\nastonishment: asombro\nendure: perdurar"
  },
  {
    id: "t15", title: "Noticia / News", level: "B2+/C1",
    en: "AI Translators Bring Ancient Texts Back to Life. Researchers at a university in Bologna have developed an AI system capable of translating ancient texts that have puzzled scholars for centuries. The tool was trained on thousands of inscriptions, many of them incomplete or damaged, and can suggest possible meanings for words that no longer exist in any modern language. In a recent trial, the system helped decipher a series of clay tablets whose content had remained unclear for over a hundred years. Historians have responded with cautious optimism, noting that the AI offers valuable clues but cannot replace the deep knowledge required to interpret a lost culture. \"It gives us a starting point,\" one researcher said, \"but the story still has to be pieced together by human minds.\" The team plans to make the tool available to other universities next year.",
    es: "Los traductores de IA devuelven la vida a textos antiguos. Unos investigadores de una universidad de Bolonia han desarrollado un sistema de IA capaz de traducir textos antiguos que han desconcertado a los estudiosos durante siglos. La herramienta fue entrenada con miles de inscripciones, muchas de ellas incompletas o dañadas, y puede sugerir posibles significados para palabras que ya no existen en ninguna lengua moderna. En una prueba reciente, el sistema ayudó a descifrar una serie de tablillas de arcilla cuyo contenido había permanecido poco claro durante más de cien años. Los historiadores han reaccionado con un optimismo cauteloso, señalando que la IA ofrece pistas valiosas pero no puede sustituir el conocimiento profundo necesario para interpretar una cultura perdida. \"Nos da un punto de partida\", dijo un investigador, \"pero la historia todavía tiene que ser reconstruida por mentes humanas\". El equipo planea poner la herramienta a disposición de otras universidades el año que viene.",
    keys: "puzzled: desconcertado\ninscriptions: inscripciones\ndecipher: descifrar\nclay tablets: tablillas de arcilla\ncautious optimism: optimismo cauteloso\nvaluable clues: pistas valiosas\npieced together: reconstruida"
  },

  // ===== 5 TEXTOS NOUS (B2+/C1) =====
  {
    id: "t16", title: "Historia / Story — La màquina que aprenia a callar", level: "B2+/C1",
    en: "The most advanced assistant in the lab had a curious flaw: it answered too much. Ask it for the time, and it would also explain the history of clocks. Ask for a summary, and it would offer three. Dr. Ibarra, who had built it, found this charming at first and exhausting later. One afternoon she typed a simple question—\"Should I publish this article?\"—and waited. The machine did not answer immediately. When it finally did, the reply was short: \"I don't have enough information to give you honest advice. What are you most afraid of?\" Ibarra stared at the screen for a long time. She had spent years teaching it to be useful. She had never taught it to be wise.",
    es: "El asistente más avanzado del laboratorio tenía un defecto curioso: respondía demasiado. Pídele la hora y también te explicaba la historia de los relojes. Pídele un resumen y te ofrecía tres. A la doctora Ibarra, que lo había construido, al principio le hacía gracia y después le resultaba agotador. Una tarde escribió una pregunta sencilla —\"¿Debería publicar este artículo?\"— y esperó. La máquina no respondió de inmediato. Cuando por fin lo hizo, la respuesta fue breve: \"No tengo suficiente información para darte un consejo honesto. ¿A qué le tienes más miedo?\". Ibarra se quedó mirando la pantalla durante un buen rato. Había pasado años enseñándole a ser útil. Nunca le había enseñado a ser sabia.",
    keys: "curious flaw: defecto curioso\nsummary: resumen\ncharming: encantador\nexhausting: agotador\nhonest advice: consejo honesto\nwise: sabia"
  },
  {
    id: "t17", title: "Noticia / News — La IA que revisa errors judicials", level: "B2+/C1",
    en: "AI Tool Reviews Old Court Cases for Possible Errors. A legal technology company in Madrid has developed an AI system that reviews past court rulings in search of contradictions, overlooked evidence, or procedural mistakes. The tool does not make decisions; it simply flags cases that may deserve a second look. During a pilot project involving five hundred archived rulings, the system identified several dozen where the reasoning appeared inconsistent or incomplete. Judges and lawyers have reacted with a mixture of interest and caution, warning that justice cannot be reduced to pattern recognition. \"The aim is not to replace judges,\" the company explained, \"but to help them notice what a busy human eye might miss.\" If the project succeeds, similar tools could be adopted in other Spanish regions.",
    es: "Una herramienta de IA revisa antiguos casos judiciales en busca de posibles errores. Una empresa de tecnología jurídica de Madrid ha desarrollado un sistema de IA que revisa sentencias pasadas en busca de contradicciones, pruebas pasadas por alto o errores procesales. La herramienta no toma decisiones; simplemente señala casos que podrían merecer una segunda mirada. Durante un proyecto piloto con quinientas sentencias archivadas, el sistema identificó varias decenas en las que el razonamiento parecía incoherente o incompleto. Jueces y abogados han reaccionado con una mezcla de interés y cautela, y advierten de que la justicia no puede reducirse al reconocimiento de patrones. \"El objetivo no es sustituir a los jueces\", explicó la empresa, \"sino ayudarles a notar lo que un ojo humano ocupado podría pasar por alto\". Si el proyecto prospera, herramientas similares podrían adoptarse en otras regiones españolas.",
    keys: "rulings: sentencias\noverlooked: pasado por alto\nprocedural mistakes: errores procesales\nflags: señala\nreasoning: razonamiento\npattern recognition: reconocimiento de patrones\nadopted: adoptadas"
  },
  {
    id: "t18", title: "Historia / Story — El último examen", level: "B2+/C1",
    en: "For his final exam, Professor Renard gave his students an unusual task: write an essay about a machine that had changed their life. Most of them wrote about apps, phones, or algorithms. But one student, a quiet girl named Aina, handed in something different. She described an old coffee machine in her grandmother's kitchen—the only thing her family had kept after the house was sold—and how every Sunday it filled the room with the same smell, the same warmth, the same memory. Renard read it twice. It was not about technology at all, and yet it was. When he returned the papers, he wrote only one comment at the bottom: \"This is what I was trying to teach you.\"",
    es: "Para su examen final, el profesor Renard dio a sus alumnos una tarea poco habitual: escribir un ensayo sobre una máquina que hubiera cambiado su vida. La mayoría escribió sobre aplicaciones, teléfonos o algoritmos. Pero una estudiante, una chica callada llamada Aina, entregó algo distinto. Describía una vieja cafetera en la cocina de su abuela —lo único que su familia había conservado tras vender la casa— y cómo cada domingo llenaba la habitación con el mismo olor, el mismo calor, el mismo recuerdo. Renard lo leyó dos veces. No trataba de tecnología en absoluto, y sin embargo sí lo hacía. Cuando devolvió los exámenes, escribió un solo comentario al final: \"Esto es lo que intentaba enseñaros\".",
    keys: "unusual task: tarea poco habitual\nhanded in: entregó\nkept: conservado\nwarmth: calor\nreturned the papers: devolvió los exámenes"
  },
  {"id": "t20", "title": "The Engineer Who Questioned the Blueprint", "level": "C1", "en": "When a young engineer joined the restoration team, she noticed a discrepancy that everyone else had overlooked. The original drawings suggested that a steel beam was carrying far less weight than the measurements indicated. Her supervisor dismissed the concern as a minor drafting error, yet she insisted on checking the structure before any work began. The inspection revealed a hidden alteration made decades earlier. Correcting it delayed the project by a week but prevented a potentially serious failure. She learnt that expertise is not about having every answer; sometimes it means being willing to ask an inconvenient question.", "es": "Cuando una joven ingeniera se incorporó al equipo de restauración, detectó una discrepancia que todos habían pasado por alto. Los planos originales indicaban que una viga de acero soportaba mucho menos peso del que mostraban las mediciones. Su supervisor descartó la preocupación como un pequeño error de dibujo, pero ella insistió en revisar la estructura antes de empezar los trabajos. La inspección reveló una modificación oculta realizada décadas atrás. Corregirla retrasó el proyecto una semana, pero evitó un fallo potencialmente grave. Aprendió que la experiencia no consiste en tener todas las respuestas; a veces significa estar dispuesto a plantear una pregunta incómoda.", "keys": "discrepancy: discrepancia\noverlooked: pasado por alto\ndismissed: descartó\ninsisted on: insistió en\nrevealed: reveló\ninconvenient: incómoda"},
  {"id": "t21", "title": "Why Small Habits Outperform Big Plans", "level": "B2+/C1", "en": "People often make ambitious plans to transform their lives overnight. However, lasting improvement is usually less dramatic. Someone who reads ten pages every evening may finish more books than a person who promises to study for five hours every Sunday. Small habits reduce the need for motivation because they become part of a routine. The challenge is consistency, particularly when the first results are barely noticeable. A useful strategy is to attach a new habit to something you already do, such as reviewing English vocabulary after breakfast. Progress may feel slow, but repeated effort can add up to a remarkable change.", "es": "Las personas suelen hacer planes ambiciosos para transformar su vida de la noche a la mañana. Sin embargo, la mejora duradera suele ser menos espectacular. Alguien que lee diez páginas cada noche puede terminar más libros que una persona que promete estudiar cinco horas cada domingo. Los pequeños hábitos reducen la necesidad de motivación porque pasan a formar parte de una rutina. El reto es la constancia, especialmente cuando los primeros resultados apenas se notan. Una estrategia útil es vincular un hábito nuevo a algo que ya haces, como repasar vocabulario de inglés después de desayunar. El progreso puede parecer lento, pero el esfuerzo repetido puede sumar un cambio notable.", "keys": "ambitious: ambicioso\novernight: de la noche a la mañana\nlasting: duradero\nconsistency: constancia\nbarely noticeable: apenas perceptible\nadd up to: sumar / dar lugar a"},
  {"id": "t22", "title": "A Weekend Without Notifications", "level": "B2", "en": "Daniel decided to turn off his phone notifications for an entire weekend. At first, he kept reaching for his phone because he was worried about missing something important. By Saturday afternoon, however, he began to enjoy the silence. He cooked a meal without checking messages, went for a long walk and finished a book he had started months earlier. On Sunday evening, he switched the notifications back on. There were plenty of messages, but very few were urgent. He did not decide to stop using technology. Instead, he chose to be more careful about when he allowed it to interrupt him.", "es": "Daniel decidió desactivar las notificaciones del móvil durante todo un fin de semana. Al principio, no paraba de buscar el teléfono porque le preocupaba perderse algo importante. Sin embargo, el sábado por la tarde empezó a disfrutar del silencio. Cocinó sin mirar mensajes, dio un largo paseo y terminó un libro que había empezado meses atrás. El domingo por la noche volvió a activar las notificaciones. Había muchos mensajes, pero muy pocos eran urgentes. No decidió dejar de usar la tecnología. En cambio, optó por tener más cuidado con los momentos en que permitía que lo interrumpiera.", "keys": "turn off: desactivar\nreaching for: buscar / echar mano de\nmissing something: perderse algo\nswitched back on: volvió a activar\nurgent: urgente\ninterrupt: interrumpir"},
  {"id": "t23", "title": "Can Artificial Intelligence Explain Its Decisions?", "level": "C1", "en": "Imagine a computer system that recommends rejecting a loan application but cannot explain why. Even if its predictions are accurate most of the time, the absence of a clear explanation makes it difficult to challenge unfair outcomes. This is why researchers study explainable artificial intelligence. Some techniques reveal which factors influenced a prediction, while others provide simplified explanations of complicated models. Yet an explanation that sounds convincing is not necessarily faithful to the underlying process. The central challenge is to make powerful systems understandable without giving people a false sense of certainty.", "es": "Imagina un sistema informático que recomienda rechazar una solicitud de préstamo, pero no puede explicar por qué. Aunque sus predicciones sean acertadas la mayoría de las veces, la falta de una explicación clara dificulta impugnar resultados injustos. Por eso los investigadores estudian la inteligencia artificial explicable. Algunas técnicas muestran qué factores influyeron en una predicción, mientras que otras ofrecen explicaciones simplificadas de modelos complejos. Sin embargo, una explicación convincente no es necesariamente fiel al proceso subyacente. El reto fundamental consiste en hacer comprensibles los sistemas potentes sin dar a las personas una falsa sensación de certeza.", "keys": "loan application: solicitud de préstamo\nchallenge: impugnar\nunfair outcomes: resultados injustos\nunderlying: subyacente\nfaithful to: fiel a\nfalse sense of certainty: falsa sensación de certeza"},
  {"id": "t24", "title": "The Last Train to Edinburgh", "level": "B2+/C1", "en": "The announcement came just as Sophie reached the platform: the last train had been delayed indefinitely. She had an important interview the following morning and nowhere nearby to stay. Rather than panic, she approached a stranger who was studying the departure board with the same worried expression. Within minutes, three passengers had agreed to share a taxi to the city. During the journey they exchanged stories, laughed at their bad luck and discovered they worked in surprisingly similar fields. Sophie arrived tired but relieved. She did not get the job the next day, yet she gained a friendship that lasted for years.", "es": "El anuncio llegó justo cuando Sophie alcanzó el andén: el último tren se había retrasado por tiempo indefinido. Tenía una entrevista importante a la mañana siguiente y ningún lugar cercano donde alojarse. En vez de entrar en pánico, se acercó a un desconocido que miraba el panel de salidas con la misma expresión preocupada. En pocos minutos, tres pasajeros habían acordado compartir un taxi hasta la ciudad. Durante el trayecto intercambiaron historias, se rieron de su mala suerte y descubrieron que trabajaban en sectores sorprendentemente parecidos. Sophie llegó cansada pero aliviada. No consiguió el puesto al día siguiente, pero ganó una amistad que duró años.", "keys": "platform: andén\ndelayed indefinitely: retrasado indefinidamente\nrather than: en vez de\ndeparture board: panel de salidas\nrelieved: aliviada\nlasted for years: duró años"},
  {"id": "t25", "title": "How Cities Could Become Cooler", "level": "B2+/C1", "en": "On hot summer days, city streets can feel much warmer than nearby parks. Dark roads absorb sunlight, while buildings trap heat and limit airflow. Urban planners are exploring practical ways to address this problem, including planting more trees, creating shaded public spaces and choosing materials that reflect more sunlight. There is no single solution: trees need water and time to grow, and reflective surfaces must be selected carefully to avoid glare. Nevertheless, combining small changes across neighbourhoods could make daily life more comfortable during increasingly frequent heatwaves.", "es": "En los días calurosos de verano, las calles de la ciudad pueden sentirse mucho más cálidas que los parques cercanos. Las carreteras oscuras absorben la luz solar, mientras que los edificios retienen el calor y limitan la circulación del aire. Los urbanistas estudian formas prácticas de abordar este problema, como plantar más árboles, crear espacios públicos con sombra y elegir materiales que reflejen más luz solar. No existe una solución única: los árboles necesitan agua y tiempo para crecer, y las superficies reflectantes deben seleccionarse cuidadosamente para evitar deslumbramientos. Aun así, combinar pequeños cambios en distintos barrios podría hacer la vida diaria más cómoda durante las olas de calor cada vez más frecuentes.", "keys": "absorb: absorber\ntrap heat: retener el calor\nairflow: circulación del aire\nshaded: con sombra\nglare: deslumbramiento\nheatwaves: olas de calor"},
  {"id": "t26", "title": "The Unexpected Value of Getting Lost", "level": "C1", "en": "While visiting Lisbon, Clara deliberately left her carefully planned itinerary at the hotel. She wandered through narrow streets, followed the sound of distant music and stopped at a tiny café where nobody seemed to be in a hurry. What she remembered afterwards was not a famous monument but the brief conversation she had with the owner, who spoke about how the neighbourhood had changed. The experience made her question her habit of treating travel as a checklist. Planning can help us make the most of limited time, she realised, but spontaneity sometimes reveals what no guidebook could have anticipated.", "es": "Durante una visita a Lisboa, Clara dejó deliberadamente su itinerario cuidadosamente planificado en el hotel. Paseó sin rumbo por calles estrechas, siguió el sonido de una música lejana y se detuvo en una pequeña cafetería donde nadie parecía tener prisa. Lo que recordó después no fue un monumento famoso, sino la breve conversación con el propietario, quien le habló de cómo había cambiado el barrio. La experiencia la llevó a cuestionar su costumbre de tratar los viajes como una lista de tareas. Planificar nos ayuda a aprovechar el tiempo limitado, comprendió, pero la espontaneidad a veces revela lo que ninguna guía podría haber previsto.", "keys": "deliberately: deliberadamente\nitinerary: itinerario\nwandered: paseó sin rumbo\nchecklist: lista de tareas\nmake the most of: aprovechar al máximo\nspontaneity: espontaneidad"},
  {"id": "t27", "title": "A Difficult Conversation at Work", "level": "B2+/C1", "en": "When the project deadline was brought forward, Marta realised her team could not deliver the same amount of work without sacrificing quality. She prepared a short report showing the tasks still outstanding and requested a meeting with the client. Instead of blaming anyone, she explained the trade-offs: they could finish sooner by reducing the scope, or keep the original scope and allow more time. The conversation was uncomfortable, but it turned into a constructive discussion. The client chose a smaller first delivery, and both sides agreed on clear priorities. Marta discovered that raising a problem early can be more professional than quietly hoping it will disappear.", "es": "Cuando adelantaron el plazo del proyecto, Marta comprendió que su equipo no podía entregar la misma cantidad de trabajo sin sacrificar la calidad. Preparó un informe breve con las tareas pendientes y solicitó una reunión con el cliente. En lugar de culpar a nadie, explicó las contrapartidas: podían terminar antes reduciendo el alcance o mantener el alcance original y disponer de más tiempo. La conversación fue incómoda, pero dio paso a un debate constructivo. El cliente eligió una primera entrega más pequeña y ambas partes acordaron prioridades claras. Marta descubrió que plantear un problema a tiempo puede ser más profesional que esperar en silencio a que desaparezca.", "keys": "brought forward: adelantado\ndeadline: plazo de entrega\noutstanding: pendiente\ntrade-offs: contrapartidas\nscope: alcance\nraising a problem: plantear un problema"},
  {"id": "t28", "title": "The Science of Learning from Mistakes", "level": "C1", "en": "A mistake can feel like evidence that we are not capable of mastering a skill. Yet errors often reveal precisely what we need to practise. In language learning, for instance, repeatedly confusing two similar expressions may indicate that our understanding is incomplete rather than absent. Feedback works best when it arrives soon enough to connect the correction with the original attempt. It also helps to revisit challenging material after a delay, instead of simply reading the right answer once. The aim is not to eliminate every mistake immediately, but to turn mistakes into information that guides the next attempt.", "es": "Un error puede parecer una prueba de que no somos capaces de dominar una habilidad. Sin embargo, los fallos a menudo revelan precisamente qué necesitamos practicar. En el aprendizaje de idiomas, por ejemplo, confundir repetidamente dos expresiones parecidas puede indicar que nuestra comprensión es incompleta, no inexistente. Los comentarios correctivos funcionan mejor cuando llegan lo suficientemente pronto como para conectar la corrección con el intento original. También ayuda volver al material difícil después de un tiempo, en lugar de limitarse a leer la respuesta correcta una vez. El objetivo no es eliminar todos los errores inmediatamente, sino convertirlos en información que oriente el siguiente intento.", "keys": "mastering: dominar\nreveal: revelar\nfeedback: comentarios correctivos\nrevisit: volver a estudiar\nchallenging: difícil / exigente\nguide: orientar"},
  {"id": "t29", "title": "A Quiet Revolution in Renewable Energy", "level": "B2+/C1", "en": "Electricity from solar panels and wind turbines is useful, but its availability changes with the weather. That makes energy storage an important part of a cleaner electricity system. Batteries can supply power when sunlight fades or the wind slows down, while other technologies store energy by pumping water uphill or producing heat for later use. Each approach involves costs, technical limits and environmental considerations. Rather than relying on one perfect invention, engineers are trying to combine several solutions. The real breakthrough may be a more flexible grid that can balance supply and demand reliably.", "es": "La electricidad de los paneles solares y los aerogeneradores es útil, pero su disponibilidad cambia con el tiempo meteorológico. Esto convierte el almacenamiento de energía en una parte importante de un sistema eléctrico más limpio. Las baterías pueden suministrar energía cuando disminuye la luz solar o se calma el viento, mientras que otras tecnologías la almacenan bombeando agua cuesta arriba o produciendo calor para usarlo más tarde. Cada método implica costes, límites técnicos y consideraciones ambientales. En lugar de depender de un único invento perfecto, los ingenieros intentan combinar varias soluciones. El verdadero avance podría ser una red más flexible capaz de equilibrar la oferta y la demanda de forma fiable.", "keys": "availability: disponibilidad\nenergy storage: almacenamiento de energía\nfades: disminuye\npumping water uphill: bombear agua cuesta arriba\nbreakthrough: gran avance\nsupply and demand: oferta y demanda"},
